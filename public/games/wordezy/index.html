<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SpellToon — Toddler Word Search</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&family=Quicksand:wght@600;700;800&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">

<style>
  :root {
    --cream: #FDF8EE;
    --card: #FFFFFF;
    --border: #F4EBD9;
    --cocoa: #4A3E3D;
    --primary: #745c00;
    --gold: #ffd23f;
    --gold-shadow: #edc22e;
    --teal: #63ecdd;
    --teal-dark: #006961;
    --coral: #ff5964;
    --coral-dark: #b52234;
    --mint: #22c55e;
    --mint-shadow: #15803d;
    --cell-bg: #FFFDF7;
    --cell-border: #E8DCC4;
    --cell-selected: #ffd23f;
    --cell-found: #86efac;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    min-height: 100%;
    background-color: var(--cream);
    color: var(--cocoa);
    font-family: 'Quicksand', system-ui, sans-serif;
    user-select: none; -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }

  .app-container {
    max-width: 680px;
    margin: 0 auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }

  .top-banner {
    width: 100%;
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: 24px;
    padding: 16px 20px;
    box-shadow: 0 6px 0 rgba(74, 62, 61, 0.08);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .theme-badge {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: 'Comfortaa', cursive, sans-serif;
    font-size: 18px;
    font-weight: 700;
    color: var(--primary);
  }

  .theme-emoji {
    font-size: 28px;
  }

  .btn-new-puzzle {
    height: 44px;
    padding: 0 18px;
    border-radius: 9999px;
    background: var(--gold);
    color: var(--primary);
    border: none;
    box-shadow: 0 3px 0 var(--gold-shadow);
    font-family: 'Comfortaa', cursive, sans-serif;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: transform 0.1s;
  }
  .btn-new-puzzle:active {
    transform: translateY(2px);
    box-shadow: 0 1px 0 var(--gold-shadow);
  }

  /* Target Word Chips (Pictures + Words) */
  .words-bar {
    width: 100%;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }

  .word-chip {
    padding: 8px 16px;
    border-radius: 20px;
    background: var(--card);
    border: 3px solid var(--border);
    box-shadow: 0 4px 0 rgba(74, 62, 61, 0.06);
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .word-chip:hover {
    transform: scale(1.04);
  }
  .word-chip:active {
    transform: scale(0.96);
  }

  .word-chip.found {
    background: #dcfce7;
    border-color: #4ade80;
    box-shadow: 0 3px 0 #22c55e;
    color: #14532d;
  }

  .word-chip .chip-emoji {
    font-size: 26px;
  }

  .word-chip .chip-text {
    font-family: 'Comfortaa', cursive, sans-serif;
    font-weight: 800;
    font-size: 18px;
    letter-spacing: 0.05em;
  }

  .word-chip .chip-check {
    color: #16a34a;
    font-weight: bold;
    display: none;
  }
  .word-chip.found .chip-check {
    display: inline-block;
  }

  /* 5x5 Big Friendly Grid */
  .grid-container {
    background: var(--card);
    border: 3px solid var(--border);
    border-radius: 28px;
    padding: 16px;
    box-shadow: 0 8px 0 rgba(74, 62, 61, 0.08);
    touch-action: none;
  }

  .letter-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 10px;
  }

  .grid-cell {
    width: clamp(52px, 14vw, 68px);
    height: clamp(52px, 14vw, 68px);
    background: var(--cell-bg);
    border: 2.5px solid var(--cell-border);
    border-radius: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Comfortaa', cursive, sans-serif;
    font-size: clamp(22px, 5.5vw, 30px);
    font-weight: 800;
    color: var(--cocoa);
    box-shadow: 0 3px 0 rgba(74, 62, 61, 0.07);
    cursor: pointer;
    transition: background-color 0.15s, transform 0.1s;
  }

  .grid-cell:hover {
    background: #FFF9E6;
  }

  .grid-cell.selected {
    background: var(--cell-selected) !important;
    border-color: var(--gold-shadow);
    color: #241a00;
    transform: scale(1.06);
    box-shadow: 0 4px 0 #edc22e;
  }

  .grid-cell.found {
    background: var(--cell-found) !important;
    border-color: #4ade80;
    color: #14532d;
    box-shadow: 0 3px 0 #16a34a;
  }

  .grid-cell.hint-glow {
    animation: pulseGlow 1s ease-in-out infinite;
  }

  @keyframes pulseGlow {
    0%, 100% { box-shadow: 0 0 0 3px var(--coral); }
    50% { box-shadow: 0 0 0 6px var(--coral); }
  }

  /* Audio speech feedback helper */
  .hint-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    font-weight: 700;
    color: rgba(74, 62, 61, 0.7);
    text-align: center;
  }

  /* Victory celebration banner */
  .win-card {
    background: #ecfdf5;
    border: 3px solid #86efac;
    border-radius: 24px;
    padding: 16px 24px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    box-shadow: 0 6px 0 #22c55e;
    animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }

  @keyframes popIn {
    0% { transform: scale(0.8); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  .win-title {
    font-family: 'Comfortaa', cursive, sans-serif;
    font-size: 22px;
    font-weight: 800;
    color: #14532d;
  }

  .win-btn {
    margin-top: 4px;
    padding: 12px 28px;
    border-radius: 9999px;
    background: #22c55e;
    color: white;
    font-family: 'Comfortaa', cursive, sans-serif;
    font-weight: 800;
    font-size: 16px;
    border: none;
    box-shadow: 0 4px 0 #15803d;
    cursor: pointer;
  }
  .win-btn:active {
    transform: translateY(2px);
    box-shadow: 0 2px 0 #15803d;
  }
</style>
</head>

<body>
<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.4/dist/confetti.browser.min.js"></script>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

// Speech synthesis helper
function speak(text) {
  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
    const utt = new SpeechSynthesisUtterance(text);
    utt.rate = 0.9;
    utt.pitch = 1.15;
    window.speechSynthesis.speak(utt);
  }
}

// Organic audio tones for taps
function playChime() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(523.25, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(659.25, ctx.currentTime + 0.12);
    gain.gain.setValueAtTime(0.2, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.35);
  } catch(e) {}
}

// ---------------------------------------------------------------------------
// TODDLER WORD BANK (Age 2-6): 3-4 letters only, familiar CVC words + emojis
// ---------------------------------------------------------------------------
const TODDLER_THEMES = [
  {
    id: 'animals',
    label: 'Animals',
    emoji: '🐮',
    words: [
      { word: 'CAT', emoji: '🐱', spoken: 'Cat! Meow!' },
      { word: 'DOG', emoji: '🐶', spoken: 'Dog! Woof!' },
      { word: 'COW', emoji: '🐮', spoken: 'Cow! Moo!' },
      { word: 'PIG', emoji: '🐷', spoken: 'Pig! Oink!' },
      { word: 'BEE', emoji: '🐝', spoken: 'Bee! Buzz!' },
      { word: 'OWL', emoji: '🦉', spoken: 'Owl! Hoot!' },
      { word: 'FOX', emoji: '🦊', spoken: 'Fox!' },
      { word: 'DUCK', emoji: '🦆', spoken: 'Duck! Quack!' },
      { word: 'FROG', emoji: '🐸', spoken: 'Frog! Ribbit!' },
      { word: 'FISH', emoji: '🐟', spoken: 'Fish! Splish splash!' },
      { word: 'LION', emoji: '🦁', spoken: 'Lion! Roar!' },
    ]
  },
  {
    id: 'nature',
    label: 'Nature',
    emoji: '☀️',
    words: [
      { word: 'SUN', emoji: '☀️', spoken: 'Sun! Warm and bright!' },
      { word: 'STAR', emoji: '⭐', spoken: 'Star! Twinkle twinkle!' },
      { word: 'MOON', emoji: '🌙', spoken: 'Moon! Goodnight moon!' },
      { word: 'TREE', emoji: '🌳', spoken: 'Tree! Green leaves!' },
      { word: 'RAIN', emoji: '🌧️', spoken: 'Rain! Pitter patter!' },
      { word: 'SNOW', emoji: '❄️', spoken: 'Snow! Cold and white!' },
      { word: 'LEAF', emoji: '🍃', spoken: 'Leaf! Blowing in the wind!' },
    ]
  },
  {
    id: 'toys',
    label: 'Toys & Wheels',
    emoji: '🚗',
    words: [
      { word: 'CAR', emoji: '🚗', spoken: 'Car! Vroom vroom!' },
      { word: 'BALL', emoji: '⚽', spoken: 'Ball! Bounce bounce!' },
      { word: 'BOAT', emoji: '⛵', spoken: 'Boat! Floating on water!' },
      { word: 'BUS', emoji: '🚌', spoken: 'Bus! The wheels on the bus!' },
      { word: 'VAN', emoji: '🚐', spoken: 'Van! Honk honk!' },
      { word: 'BOOK', emoji: '📖', spoken: 'Book! Story time!' },
      { word: 'DOLL', emoji: '🪆', spoken: 'Doll! Sweet toy!' },
    ]
  },
  {
    id: 'food',
    label: 'Yummy Snacks',
    emoji: '🍎',
    words: [
      { word: 'JAM', emoji: '🍓', spoken: 'Jam! Sweet berry jam!' },
      { word: 'EGG', emoji: '🥚', spoken: 'Egg! Breakfast snack!' },
      { word: 'MILK', emoji: '🥛', spoken: 'Milk! Sip sip!' },
      { word: 'PEAR', emoji: '🍐', spoken: 'Pear! Juicy fruit!' },
      { word: 'CAKE', emoji: '🎂', spoken: 'Cake! Happy birthday!' },
      { word: 'CORN', emoji: '🌽', spoken: 'Corn! Pop pop!' },
    ]
  },
  {
    id: 'colors',
    label: 'Colors',
    emoji: '🎨',
    words: [
      { word: 'RED', emoji: '🔴', spoken: 'Red color!' },
      { word: 'BLUE', emoji: '🔵', spoken: 'Blue color!' },
      { word: 'PINK', emoji: '🌸', spoken: 'Pink color!' },
      { word: 'GOLD', emoji: '🟡', spoken: 'Gold color!' },
    ]
  }
];

// 5x5 Grid generator: ONLY Horizontal (left->right) and Vertical (top->down)
// NO backwards, NO diagonals (easy for 2-6 year olds!)
function generateToddlerPuzzle(theme) {
  const size = 5;
  const grid = Array.from({ length: size }, () => Array(size).fill(null));
  
  // Pick 3 random words from the theme
  const shuffled = [...theme.words].sort(() => Math.random() - 0.5);
  const selectedWords = shuffled.slice(0, 3);
  const placedWords = [];

  // Allowed directions: right [0, 1] and down [1, 0]
  const dirs = [[0, 1], [1, 0]];

  for (const item of selectedWords) {
    const word = item.word;
    let placed = false;

    // Try multiple placements
    for (let attempts = 0; attempts < 150 && !placed; attempts++) {
      const dir = dirs[Math.floor(Math.random() * dirs.length)];
      const maxRow = dir[0] === 0 ? size - 1 : size - word.length;
      const maxCol = dir[1] === 0 ? size - 1 : size - word.length;
      if (maxRow < 0 || maxCol < 0) continue;

      const r = Math.floor(Math.random() * (maxRow + 1));
      const c = Math.floor(Math.random() * (maxCol + 1));

      // Check collision
      let canPlace = true;
      for (let i = 0; i < word.length; i++) {
        const curR = r + dir[0] * i;
        const curC = c + dir[1] * i;
        if (grid[curR][curC] !== null && grid[curR][curC] !== word[i]) {
          canPlace = false;
          break;
        }
      }

      if (canPlace) {
        for (let i = 0; i < word.length; i++) {
          grid[r + dir[0] * i][c + dir[1] * i] = word[i];
        }
        placedWords.push({
          word,
          emoji: item.emoji,
          spoken: item.spoken,
          row: r,
          col: c,
          dRow: dir[0],
          dCol: dir[1],
          length: word.length,
        });
        placed = true;
      }
    }
  }

  // Fill empty spaces with simple kid-friendly letters
  const fillerLetters = ['A', 'B', 'C', 'D', 'E', 'O', 'P', 'S', 'T'];
  for (let r = 0; r < size; r++) {
    for (let c = 0; c < size; c++) {
      if (grid[r][c] === null) {
        grid[r][c] = fillerLetters[Math.floor(Math.random() * fillerLetters.length)];
      }
    }
  }

  return {
    theme,
    grid,
    words: placedWords,
  };
}

function ToddlerWordSearch() {
  const [themeIndex, setThemeIndex] = useState(0);
  const [puzzle, setPuzzle] = useState(() => generateToddlerPuzzle(TODDLER_THEMES[0]));
  const [foundWords, setFoundWords] = useState(new Set());
  const [selectedCells, setSelectedCells] = useState([]);
  const [isDragging, setIsDragging] = useState(false);
  const [startCell, setStartCell] = useState(null);
  const [hintWord, setHintWord] = useState(null);

  const theme = TODDLER_THEMES[themeIndex];

  // Welcome speech on mount
  useEffect(() => {
    speak('Welcome to Word Search! Tap a picture to hear the word, then trace it on the letters!');
  }, []);

  // New puzzle generator
  const loadNewPuzzle = (nextThemeIdx = null) => {
    const idx = nextThemeIdx !== null ? nextThemeIdx : (themeIndex + 1) % TODDLER_THEMES.length;
    setThemeIndex(idx);
    const nextTheme = TODDLER_THEMES[idx];
    const newPuz = generateToddlerPuzzle(nextTheme);
    setPuzzle(newPuz);
    setFoundWords(new Set());
    setSelectedCells([]);
    setStartCell(null);
    setHintWord(null);
    speak('New puzzle! Theme is: ' + nextTheme.label);
  };

  // Check if cell is in a found word
  const isCellInFoundWord = (r, c) => {
    for (const pw of puzzle.words) {
      if (foundWords.has(pw.word)) {
        for (let i = 0; i < pw.length; i++) {
          if (pw.row + pw.dRow * i === r && pw.col + pw.dCol * i === c) {
            return true;
          }
        }
      }
    }
    return false;
  };

  // Coordinate check for selection
  const isCellSelected = (r, c) => {
    return selectedCells.some(cell => cell.r === r && cell.c === c);
  };

  // Check if cell has hint glow
  const isCellHint = (r, c) => {
    if (!hintWord) return false;
    return hintWord.row === r && hintWord.col === c;
  };

  // Calculate straight path between two cells
  const getPath = (from, to) => {
    const dR = to.r - from.r;
    const dC = to.c - from.c;
    const path = [];

    // Horizontal only
    if (dR === 0 && dC !== 0) {
      const step = Math.sign(dC);
      for (let c = from.c; c !== to.c + step; c += step) {
        path.push({ r: from.r, c });
      }
      return path;
    }

    // Vertical only
    if (dC === 0 && dR !== 0) {
      const step = Math.sign(dR);
      for (let r = from.r; r !== to.r + step; r += step) {
        path.push({ r, c: from.c });
      }
      return path;
    }

    // Single cell
    if (dR === 0 && dC === 0) {
      return [from];
    }

    return [from];
  };

  // Start touch/drag
  const handleCellDown = (r, c) => {
    playChime();
    setIsDragging(true);
    setStartCell({ r, c });
    setSelectedCells([{ r, c }]);
    // Speak letter
    speak(puzzle.grid[r][c]);
  };

  // Move touch/drag
  const handleCellEnter = (r, c) => {
    if (!isDragging || !startCell) return;
    const path = getPath(startCell, { r, c });
    setSelectedCells(path);
  };

  // Finish touch/drag and evaluate
  const handleEndDrag = () => {
    if (!isDragging) return;
    setIsDragging(false);

    if (selectedCells.length >= 2) {
      // Check if selected cells match any target word
      const selectedWord = selectedCells.map(cell => puzzle.grid[cell.r][cell.c]).join('');
      const matched = puzzle.words.find(w => w.word === selectedWord);

      if (matched && !foundWords.has(matched.word)) {
        playChime();
        speak('Great job! You found ' + matched.word + '! ' + matched.spoken);
        const nextFound = new Set(foundWords);
        nextFound.add(matched.word);
        setFoundWords(nextFound);
        setHintWord(null);

        // Confetti if all found!
        if (nextFound.size === puzzle.words.length) {
          setTimeout(() => {
            speak('Hooray! You found all the words! You are a super speller!');
            if (window.confetti) {
              window.confetti({
                particleCount: 70,
                spread: 80,
                origin: { y: 0.6 }
              });
            }
          }, 800);
        }
      }
    }

    setSelectedCells([]);
    setStartCell(null);
  };

  // Handle tap on a word chip to hear and get a gentle hint
  const handleWordChipClick = (item) => {
    speak(item.spoken || item.word);
    setHintWord(item);
  };

  const isAllComplete = foundWords.size === puzzle.words.length && puzzle.words.length > 0;

  return (
    <div className="app-container" onMouseUp={handleEndDrag} onTouchEnd={handleEndDrag}>
      {/* Top Header Card */}
      <div className="top-banner">
        <div className="theme-badge">
          <span className="theme-emoji">{puzzle.theme.emoji}</span>
          <span>{puzzle.theme.label}</span>
        </div>

        <button type="button" className="btn-new-puzzle" onClick={() => loadNewPuzzle()}>
          <span className="material-symbols-outlined" style={{ fontSize: '18px' }}>refresh</span>
          <span>Next Theme</span>
        </button>
      </div>

      {/* Target Word Chips (With Emojis for Pre-Readers!) */}
      <div className="words-bar">
        {puzzle.words.map(w => {
          const isFound = foundWords.has(w.word);
          return (
            <div
              key={w.word}
              className={`word-chip ${isFound ? 'found' : ''}`}
              onClick={() => handleWordChipClick(w)}
              title="Tap to hear word"
            >
              <span className="chip-emoji">{w.emoji}</span>
              <span className="chip-text">{w.word}</span>
              <span className="chip-check">✓</span>
            </div>
          );
        })}
      </div>

      {/* Big Friendly 5x5 Letter Grid */}
      <div className="grid-container">
        <div className="letter-grid">
          {puzzle.grid.map((row, r) =>
            row.map((letter, c) => {
              const isFound = isCellInFoundWord(r, c);
              const isSelected = isCellSelected(r, c);
              const isGlow = isCellHint(r, c);

              return (
                <div
                  key={`${r}-${c}`}
                  className={`grid-cell ${isFound ? 'found' : ''} ${isSelected ? 'selected' : ''} ${isGlow ? 'hint-glow' : ''}`}
                  onMouseDown={() => handleCellDown(r, c)}
                  onMouseEnter={() => handleCellEnter(r, c)}
                  onTouchStart={() => handleCellDown(r, c)}
                  onTouchMove={(e) => {
                    const touch = e.touches[0];
                    if (touch) {
                      const el = document.elementFromPoint(touch.clientX, touch.clientY);
                      if (el && el.dataset && el.dataset.row != null) {
                        handleCellEnter(Number(el.dataset.row), Number(el.dataset.col));
                      }
                    }
                  }}
                  data-row={r}
                  data-col={c}
                >
                  {letter}
                </div>
              );
            })
          )}
        </div>
      </div>

      {/* Audio & Visual Instructions */}
      <div className="hint-row">
        <span>👆 Tap any picture to hear its sound! Drag across letters to spell!</span>
      </div>

      {/* Win Celebration Card */}
      {isAllComplete && (
        <div className="win-card">
          <div className="win-title">🌟 You Found All Words! 🌟</div>
          <p style={{ margin: 0, fontSize: '14px', fontWeight: 700, color: '#166534' }}>
            Wonderful job! Ready for more picture words?
          </p>
          <button type="button" className="win-btn" onClick={() => loadNewPuzzle()}>
            Play Next Puzzle 🚀
          </button>
        </div>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<ToddlerWordSearch />);
</script>
</body>
</html>
